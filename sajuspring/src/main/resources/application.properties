spring.application.name=sajuspring
# Aiven MySQL: require TLS; never fall back to an unencrypted connection.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Inspect existing tables only. Provision a reviewed schema separately if missing.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# V1 applied with approval; validate history and apply versioned migrations on startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
